<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>오땡뭐!</title>
  <meta name="description" content="고민은 그만. 지금 내 주변에서 먹을 곳 하나를 골라드려요." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="오땡뭐!" />
  <meta property="og:url" content="https://site-six-wheat-70.vercel.app/" />
  <meta property="og:title" content="오땡뭐! 오늘 점심 뭐먹지?" />
  <meta property="og:description" content="고민은 그만. 지금 내 주변에서 먹을 곳 하나를 골라드려요." />
  <meta property="og:image" content="https://site-six-wheat-70.vercel.app/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app" class="home">
    <header class="brand">
      <p class="mark">오땡뭐!</p>
      <h1>오늘 <span class="rot" aria-hidden="true"><span id="rot-word">점심</span></span><span class="sr-only" id="rot-sr">점심</span> 뭐먹지<span class="dot">?</span></h1>
      <p class="tagline">고민은 그만, 하나만 골라드릴게요</p>
    </header>

    <div id="locbar" class="locbar" role="status" hidden>
      <p id="loc-text"></p>
      <button id="loc-btn" type="button">위치 허용</button>
    </div>

    <section id="chat" class="chat" aria-live="polite"></section>

    <form id="ask" class="ask" autocomplete="off">
      <input id="q" type="text" inputmode="search" enterkeyhint="send"
             placeholder="예: 중식, 국밥, 비 오는 날" aria-label="먹고 싶은 것" />
      <button type="submit" aria-label="추천받기">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>

    <nav class="chip-rows" aria-label="빠른 선택">
      <div id="chips-cat" class="chips" aria-label="음식 종류"></div>
      <div id="chips-sit" class="chips" aria-label="상황"></div>
    </nav>
    <p id="notice" class="notice" hidden></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
